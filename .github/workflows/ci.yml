# TODO 1: 给工作流命名，例如 "CI"
name: CI

# TODO 2: 设置触发条件 - 对 main 分支的 push 和 pull_request 都触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # TODO 3: 选择运行器 - 使用最新 Ubuntu 托管运行器
    runs-on: ubuntu-latest

    steps:
      # TODO 4: 使用官方 action 检出仓库代码
      - name: Checkout source
        uses: actions/checkout@v4

      # TODO 5: 配置 Java 21（Temurin 发行版）并启用 Maven 缓存
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO 6: 使用 Maven 构建项目，跳过测试
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # TODO 7: 运行测试
      - name: Run tests
        run: mvn -B test